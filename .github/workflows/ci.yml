name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading_platform
          POSTGRES_PASSWORD: trading_platform
          POSTGRES_DB: trading_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trading_platform -d trading_platform"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TRADING_PLATFORM_DATABASE_URL: postgresql+psycopg://trading_platform:trading_platform@127.0.0.1:5432/trading_platform
      TRADING_PLATFORM_TESTNET_DATABASE_URL: postgresql+psycopg://trading_platform:trading_platform@127.0.0.1:5432/trading_platform
      TRADING_PLATFORM_PRIVILEGE_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m venv .venv-runtime
          .venv-runtime/bin/python -m pip install -r requirements-runtime.txt
          python -m venv .venv-research
          .venv-research/bin/python -m pip install -r requirements-research-linux.txt -r requirements-dev.txt
          python -m venv .venv-agent
          .venv-agent/bin/python -m pip install -r requirements-agent.txt
          ln -s .venv-research .venv
      - name: Lint
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m ruff format --check .
      - name: Type-check platform boundary
        run: make typecheck-platform
      - name: Validate production autopilot configuration
        run: |
          unlink .venv
          ln -s .venv-runtime .venv
          trap 'unlink .venv; ln -s .venv-research .venv' EXIT
          .venv/bin/python -m src.autopilot.runtime --config config/autopilot.json --validate
      - name: Apply and verify PostgreSQL migrations
        run: |
          .venv-runtime/bin/python -m alembic upgrade head
          .venv/bin/python -m src.data.migrate
          .venv/bin/python -m src.data.migrate --check
      - name: Verify installed service users and permissions
        run: |
          sudo apt-get update
          sudo apt-get install -y acl
          sudo mv "$GITHUB_WORKSPACE" /opt/trading-bot
          sudo ln -s /opt/trading-bot "$GITHUB_WORKSPACE"
          jq '.postgresql.require_tls = false' /opt/trading-bot/config/platform.json \
            > /opt/trading-bot/config/platform.ci.json
          sudo env REPO=/opt/trading-bot NODE=linux-optiplex SKIP_SYSTEMD=1 \
            bash scripts/install_platform_services.sh
          sudo env REPO=/opt/trading-bot \
            TRADING_PLATFORM_CONFIG=/opt/trading-bot/config/platform.ci.json \
            TRADING_PLATFORM_DATABASE_URL="$TRADING_PLATFORM_DATABASE_URL" \
            bash scripts/verify_platform_service_install.sh
      - name: Validate platform installer
        run: make platform-install-dry-run
      - name: PostgreSQL privilege boundary
        run: .venv/bin/python -m pytest tests/test_postgresql_privileges.py -q
      - name: Platform smoke
        run: make platform-smoke
      - name: Test
        run: .venv/bin/python -m pytest
