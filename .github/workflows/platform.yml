name: Platform quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trading_bot
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trading_bot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TRADING_PLATFORM_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/trading_bot
      TRADING_PLATFORM_TESTNET_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/trading_bot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run platform quality and integration gate
        run: make platform-ci
